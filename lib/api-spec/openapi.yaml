openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Hackathon website API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: registration
    description: Participant registration
  - name: admin
    description: Admin operations (protected)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /registrations:
    post:
      operationId: submitRegistration
      tags: [registration]
      summary: Register for BuilderWars
      description: Creates one registration with status "pending". The confirmation email is sent after the registration is saved; if it fails, the registration is kept and marked for a resend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationConfirmation"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /registrations/check:
    get:
      operationId: checkRegistration
      tags: [registration]
      summary: Check if an email is already registered
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationCheckResult"

  /information-packet:
    get:
      operationId: downloadInformationPacket
      tags: [registration]
      summary: Download the BuilderWars information packet
      responses:
        "200":
          description: Information packet PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /admin/registrations:
    get:
      operationId: listRegistrations
      tags: [admin]
      summary: List registrations
      description: Returns paginated registrations with optional search and filter. Requires authentication.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: experience_level
          in: query
          required: false
          schema:
            type: string
        - name: team_status
          in: query
          required: false
          schema:
            type: string
        - name: access
          in: query
          required: false
          description: "active (pending or approved) or removed (declined or waitlisted)"
          schema:
            type: string
            enum: [active, removed]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of registrations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRegistrationList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/registrations/{id}:
    delete:
      operationId: deleteRegistration
      tags: [admin]
      summary: Delete a registration
      description: Permanently delete one registration. Requires organizer authentication.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Registration deleted
        "400":
          description: Invalid registration ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Registration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/registrations/{id}/status:
    patch:
      operationId: updateRegistrationStatus
      tags: [admin]
      summary: Remove a registration from the event, or restore it
      description: Sets status to "declined" (remove; the Discord bot then removes the participant role) or "pending" (restore), if allowed and the registration still has expected_status. Records the change in its history. Requires organizer authentication.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusChangeInput"
      responses:
        "200":
          description: Status changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          description: Change not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Registration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Someone else changed the status first; reload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/registrations/{id}/history:
    get:
      operationId: getRegistrationHistory
      tags: [admin]
      summary: Status change history for one registration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Changes, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusHistory"
        "404":
          description: Registration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/registrations/{id}/resend-confirmation:
    post:
      operationId: resendConfirmation
      tags: [admin]
      summary: Resend a registration's confirmation email
      description: Sends the confirmation email again and records when it was sent. Requires organizer authentication.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendConfirmationResult"
        "404":
          description: Registration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The email provider rejected the email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get registration statistics
      description: Returns the total and breakdowns by experience level and team status. Requires authentication.
      responses:
        "200":
          description: Registration stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/export:
    get:
      operationId: exportRegistrations
      tags: [admin]
      summary: Export registrations as CSV
      description: Download all registrations as a CSV file. Requires authentication.
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/user:
    get:
      operationId: getAuthUser
      tags: [admin]
      summary: Get current authenticated user info
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    RegistrationInput:
      type: object
      required: [name, email, school, class_standing, experience_level, discord_username, team_status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          pattern: "^[^\\s@]+@[^\\s@]+\\.[Ee][Dd][Uu]$"
          maxLength: 255
        school:
          type: string
          minLength: 1
          maxLength: 255
        class_standing:
          type: string
          enum: [freshman, sophomore, junior, senior, graduate]
        experience_level:
          type: string
          enum: [beginner, intermediate, advanced, professional]
        discord_username:
          type: string
          minLength: 2
          maxLength: 37
        team_status:
          type: string
          enum: [has_team, looking, solo]
        team_name:
          type: ["string", "null"]
          maxLength: 100

    RegistrationConfirmation:
      type: object
      required: [id, name, email, status, confirmation_email_sent]
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
        status:
          type: string
        confirmation_email_sent:
          type: boolean

    Registration:
      type: object
      required: [id, name, email, school, class_standing, experience_level, status, allowed_statuses, discord_status, source, created_at]
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
        school:
          type: string
        class_standing:
          type: string
        experience_level:
          type: string
        discord_username:
          type: ["string", "null"]
        team_status:
          type: ["string", "null"]
        team_name:
          type: ["string", "null"]
        status:
          type: string
        status_updated_at:
          type: ["string", "null"]
          format: date-time
        allowed_statuses:
          type: array
          items:
            type: string
        discord_status:
          type: string
          enum: [verified, removed, not_verified, unknown]
          description: "From the Discord bot's records. unknown = the website can't read them."
        discord_verified_at:
          type: ["string", "null"]
          format: date-time
        source:
          type: string
        confirmation_email_sent_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    StatusChangeInput:
      type: object
      required: [status, expected_status]
      properties:
        status:
          type: string
          enum: [pending, declined]
        expected_status:
          type: string

    StatusChange:
      type: object
      required: [from_status, to_status, changed_by_email, changed_at]
      properties:
        from_status:
          type: string
        to_status:
          type: string
        changed_by_email:
          type: string
        changed_at:
          type: string
          format: date-time

    StatusHistory:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/StatusChange"

    ResendConfirmationResult:
      type: object
      required: [confirmation_email_sent_at]
      properties:
        confirmation_email_sent_at:
          type: string
          format: date-time

    RegistrationCheckResult:
      type: object
      required: [registered]
      properties:
        registered:
          type: boolean

    AdminRegistrationList:
      type: object
      required: [registrations, total]
      properties:
        registrations:
          type: array
          items:
            $ref: "#/components/schemas/Registration"
        total:
          type: number

    AdminStats:
      type: object
      required: [total, by_experience_level, by_team_status, by_status, discord_verified]
      properties:
        total:
          type: number
        by_experience_level:
          type: object
          additionalProperties:
            type: number
        by_team_status:
          type: object
          additionalProperties:
            type: number
        by_status:
          type: object
          additionalProperties:
            type: number
        discord_verified:
          type: ["number", "null"]
          description: "Active registrations verified on Discord; null if the bot's records can't be read."

    AuthUser:
      type: object
      required: [id, name, roles]
      properties:
        id:
          type: string
        name:
          type: ["string", "null"]
        profileImage:
          type: ["string", "null"]
        roles:
          type: array
          items:
            type: string

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
