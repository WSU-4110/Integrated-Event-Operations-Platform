name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: pnpm run build
        env:
          PORT: 8080
          BASE_PATH: /

  test:
    runs-on: ubuntu-latest
    # A throwaway PostgreSQL for the API tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: API security tests
        run: pnpm --filter @workspace/api-server test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
