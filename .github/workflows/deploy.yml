name: Deploy

# Builds the Docker image and deploys it to the Lightsail container service.
# Runs on every push to main once the repository variable DEPLOY_ENABLED is
# "true" (see docs/deployment.md for the one-time AWS and GitHub setup).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets GitHub sign in to AWS without stored access keys

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  SERVICE_NAME: container-service-builderwars

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails early with a clear message if DATABASE_URL is malformed. Prints
      # only non-secret parts (never the user name or password).
      - name: Check settings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 - <<'PY'
          import os, re, sys, urllib.parse as u
          raw = os.environ.get("DATABASE_URL", "")
          problems = []
          if not raw:
              sys.exit("DATABASE_URL is empty")
          if raw != raw.strip():
              problems.append("leading or trailing whitespace or line break")
          if any(c in raw for c in " \t\r\n\"'"):
              problems.append("contains a space, tab, line break, or quote")
          # Report stray brackets by part before parsing; the parser only says
          # "Invalid IPv6 URL", which doesn't say where the problem is.
          rest = raw.strip().split("://", 1)[-1]
          userinfo, _, hostpart = rest.rpartition("@")
          user_part, _, password_part = userinfo.partition(":")
          for name, part in (("user name", user_part), ("password", password_part), ("host, port, or database", hostpart)):
              if "[" in part or "]" in part:
                  problems.append(f"the {name} contains [ or ]; encode the password, and don't wrap values in brackets")
          if problems:
              sys.exit("DATABASE_URL problems: " + "; ".join(problems))
          p = u.urlsplit(raw.strip())
          print("length:", len(raw))
          print("scheme:", p.scheme)
          print("host:", p.hostname)
          print("port:", p.port)
          print("database:", p.path.lstrip("/"))
          print("has user name:", bool(p.username), "| has password:", bool(p.password))
          if p.scheme not in ("postgres", "postgresql"):
              problems.append("scheme should be postgresql")
          if not p.hostname or "." not in p.hostname:
              problems.append("host doesn't look like a database endpoint")
          if p.password and re.search(r"%(?![0-9A-Fa-f]{2})", p.password):
              problems.append("password has a % that isn't followed by two hex digits")
          if p.query:
              problems.append("has ?query options; remove them (sslmode overrides the certificate check)")
          if problems:
              sys.exit("DATABASE_URL problems: " + "; ".join(problems))
          print("DATABASE_URL looks well formed")
          PY

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install the Lightsail container plugin
        run: |
          sudo curl -fsSL "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Build the image
        run: docker build -t builderwars:${{ github.sha }} .

      - name: Push the image to Lightsail
        run: |
          aws lightsail push-container-image \
            --service-name "$SERVICE_NAME" \
            --label app \
            --image "builderwars:${{ github.sha }}"
          IMAGE=$(aws lightsail get-container-images --service-name "$SERVICE_NAME" \
            --query 'containerImages[0].image' --output text)
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          CANONICAL_HOST: ${{ vars.CANONICAL_HOST }}
        run: |
          jq -n --arg image "$IMAGE" '{
            app: {
              image: $image,
              ports: { "8080": "HTTP" },
              environment: (env | with_entries(select(.key | IN(
                "DATABASE_URL", "ADMIN_EMAILS", "GOOGLE_CLIENT_ID",
                "GOOGLE_CLIENT_SECRET", "RESEND_API_KEY", "RESEND_FROM_EMAIL",
                "CANONICAL_HOST"
              )) | select(.value != "")))
            }
          }' > containers.json
          echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          VERSION=$(aws lightsail create-container-service-deployment \
            --service-name "$SERVICE_NAME" \
            --containers file://containers.json \
            --public-endpoint '{"containerName":"app","containerPort":8080,"healthCheck":{"path":"/api/healthz","successCodes":"200"}}' \
            --query 'containerService.nextDeployment.version' --output text)
          rm containers.json
          echo "Created deployment $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Lightsail starts the container, runs migrations, and waits for the
      # health check. Wait for that here so a failed start fails this run.
      - name: Wait for the deployment
        run: |
          for i in $(seq 1 60); do
            STATE=$(aws lightsail get-container-service-deployments \
              --service-name "$SERVICE_NAME" \
              --query "deployments[?version==\`$VERSION\`].state | [0]" --output text)
            echo "$(date -u +%H:%M:%S) deployment $VERSION: $STATE"
            case "$STATE" in
              ACTIVE) exit 0 ;;
              FAILED|INACTIVE) exit 1 ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for deployment $VERSION"
          exit 1

      - name: Container logs
        if: always() && env.VERSION != ''
        run: |
          echo "Service status:"
          aws lightsail get-container-services --service-name "$SERVICE_NAME" \
            --query 'containerServices[0].{state: state, detail: stateDetail, currentDeployment: currentDeployment.version}' \
            --output json
          # Lightsail can take a minute to make new log lines available.
          sleep 60
          echo "Container logs since $STARTED_AT:"
          aws lightsail get-container-log \
            --service-name "$SERVICE_NAME" \
            --container-name app \
            --start-time "$STARTED_AT" \
            --query 'logEvents[].[createdAt, message]' --output text | tail -n 80
          echo "Most recent log lines for the service (any deployment):"
          aws lightsail get-container-log \
            --service-name "$SERVICE_NAME" \
            --container-name app \
            --query 'logEvents[].[createdAt, message]' --output text | tail -n 15
